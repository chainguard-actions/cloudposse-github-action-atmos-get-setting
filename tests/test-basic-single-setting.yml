name: Test basic single setting extraction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install atmos
        uses: cloudposse/github-action-setup-atmos@60878d48037763f759aedee74e9cc0c2dc88e9ec # v3.5.0
        with:
          install-wrapper: false

      - id: action
        uses: .
        env:
          ATMOS_CLI_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures
          ATMOS_BASE_PATH: ${{ github.workspace }}/tests/fixtures
        with:
          component: foo
          stack: core-ue1-dev
          settings-path: settings.level1.level2.level3.secrets-arn

      - name: Assert single setting value
        env:
          ACTUAL: ${{ steps.action.outputs.value }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="arn:aws:secretsmanager:us-east-1:000000000000:secret:MySecret-PlMes3"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
