name: Test multiple settings extraction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install atmos
        run: |
          curl -sSL https://github.com/cloudposse/atmos/releases/download/v1.170.0/atmos_1.170.0_linux_amd64 -o /usr/local/bin/atmos
          chmod +x /usr/local/bin/atmos
          atmos version

      - id: action
        uses: .
        with:
          settings: |
            - component: foo
              stack: core-ue1-dev
              settingsPath: atmos_cli_config.components.terraform.base_path
              outputPath: prop1
            - component: foo
              stack: core-ue1-dev
              settingsPath: settings.level1.level2.level3.secrets-arn
              outputPath: secretArn

      - name: Assert settings output contains both values
        env:
          ACTUAL: ${{ steps.action.outputs.settings }}
        run: |
          echo "actual: $ACTUAL"
          # Check that prop1 is present with the correct value
          if ! echo "$ACTUAL" | grep -q '"prop1":"components/terraform"'; then
            echo "FAIL: expected prop1 to be 'components/terraform' in: $ACTUAL"
            exit 1
          fi
          # Check that secretArn is present with the correct value
          if ! echo "$ACTUAL" | grep -q '"secretArn":"arn:aws:secretsmanager:us-east-1:000000000000:secret:MySecret-PlMes3"'; then
            echo "FAIL: expected secretArn to be the secrets ARN in: $ACTUAL"
            exit 1
          fi
          echo "PASS"
