name: Test multiple settings extraction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install atmos
        uses: cloudposse/github-action-setup-atmos@60878d48037763f759aedee74e9cc0c2dc88e9ec # v3.5.0
        with:
          install-wrapper: false

      - id: action
        uses: .
        env:
          ATMOS_CLI_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures
          ATMOS_BASE_PATH: ${{ github.workspace }}/tests/fixtures
        with:
          settings: |
            - component: foo
              stack: core-ue1-dev
              settingsPath: vars.stage
              outputPath: stage
            - component: foo
              stack: core-ue1-dev
              settingsPath: vars.namespace
              outputPath: namespace

      - name: Assert multiple settings output
        env:
          ACTUAL: ${{ steps.action.outputs.settings }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty settings output"
            exit 1
          fi
          # Check that the JSON contains the expected keys and values
          STAGE=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('stage',''))")
          NAMESPACE=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('namespace',''))")
          echo "stage: $STAGE"
          echo "namespace: $NAMESPACE"
          if [ "$STAGE" != "dev" ]; then
            echo "FAIL: expected stage='dev' but got '$STAGE'"
            exit 1
          fi
          if [ "$NAMESPACE" != "demo" ]; then
            echo "FAIL: expected namespace='demo' but got '$NAMESPACE'"
            exit 1
          fi
          echo "PASS"
