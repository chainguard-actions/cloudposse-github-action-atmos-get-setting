name: Test Terraform functions disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install atmos
        run: |
          curl -sSL https://github.com/cloudposse/atmos/releases/download/v1.170.0/atmos_1.170.0_linux_amd64 -o /usr/local/bin/atmos
          chmod +x /usr/local/bin/atmos
          atmos version

      - id: action
        uses: .
        with:
          component: hellofunction
          stack: core-ue1-dev
          settings-path: settings.level1.example
          process-functions: "false"

      - name: Assert value is the raw terraform function expression
        env:
          ACTUAL: ${{ steps.action.outputs.value }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="!terraform.output dependency .id"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected raw terraform function expression but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
